[workspace]
members = [".", "crates/lapis-desktop"]

[package]
name = "lapis"
version = "0.1.0"
edition = "2024"
description = "Agent-first notes vault: JSON CLI, MCP, and TUI over Markdown files indexed by Lapis Lattice."
license = "MIT"
repository = "https://github.com/VirtualMachinist/lapis"
default-run = "lapis"

[[bin]]
name = "lapis"
path = "src/main.rs"

[features]
default = []
# GPUI desktop shell. Off by default: `lapis desktop` then reports it is not built in.
desktop = ["lapis-desktop/gpui"]

[dependencies]
lapis-desktop = { path = "crates/lapis-desktop" }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
gray_matter = "0.3"
jiff = "0.2"
notify = "8"
pdf-extract = "0.12"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
ratatui-textarea = { version = "0.9", features = ["search"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "1"
yaml_serde = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
