[workspace]
members = [".", "crates/lapis-desktop", "crates/lapis-lattice"]

[package]
name = "lapis"
version = "0.4.1"
edition = "2024"
description = "Agent-first notes vault: JSON CLI, MCP, and TUI over Markdown files indexed by Lapis Lattice."
license = "MIT"
repository = "https://github.com/VirtualMachinist/lapis-lattice"
publish = false
default-run = "lapis"

[[bin]]
name = "lapis"
path = "src/main.rs"

[features]
default = []
# GPUI desktop shell. Off by default: `lapis desktop` then reports it is not built in.
desktop = ["lapis-desktop/gpui"]

[dependencies]
base64 = "0.22"
lapis-desktop = { path = "crates/lapis-desktop" }
lapis-lattice = { path = "crates/lapis-lattice", version = "0.4.1" }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
gray_matter = "0.3"
jiff = "0.2"
notify = "8"
pdf-extract = "0.12"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
# Upstream #30 exposes the renderer's scroll and Unicode coordinate mapping.
ratatui-textarea = { git = "https://github.com/ratatui/ratatui-textarea", rev = "bf06674937cbdde4b00d73b3255d1d49d0bf5fc0", features = ["search"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
toml = "1"
yaml_serde = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
