# FIXTURE — not a shipped theme, not a Lapis palette.
# Captured verbatim from lathe (Omahedron) on 2026-09-10:
#   ~/.local/state/omarchy/current/theme/colors.toml   theme.name = hedron
# Kept as-is on purpose: it exercises mode, all four background and foreground
# tiers, the full ANSI set, an accent/orange collision (both #a96a38), and the
# two non-hex hyprland_* values the loader must ignore.
# Refresh by re-copying from a live Omarchy box; do not hand-edit to make a
# test pass.

# Hedron — dark. Palette extracted from hedron-platonic-altar.jpeg wallpaper (2026-09-03).
# Dominant hues: deep indigo/lapis/violet; warm counterpoints copper + gold starlight; icy mist accents.
mode = "dark"

accent = "#a96a38"
selection = "#1c2450"
muted = "#8b93b8"

background = "#0a0e1e"
dark_background = "#080b18"
darker_background = "#060a16"
lighter_background = "#141a38"

foreground = "#eef1ff"
dark_foreground = "#8b93b8"
light_foreground = "#b7bfe8"
bright_foreground = "#f4f8ff"

# Solid copper for shell + window borders (gradient can stress Quickshell chrome).
hyprland_active_border = "rgba(a96a38ee)"
hyprland_inactive_border = "rgb(1c2450)"

red = "#c45c4a"
yellow = "#e6bf6a"
orange = "#a96a38"
green = "#5a9e8a"
cyan = "#9dc3d4"
blue = "#2e5ab8"
magenta = "#7a68c4"
brown = "#75452a"

bright_red = "#dda77d"
bright_yellow = "#f0d98f"
bright_green = "#7dbcae"
bright_cyan = "#cfeaf5"
bright_blue = "#4a6fd8"
bright_magenta = "#9c8de0"
