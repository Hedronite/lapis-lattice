# tome-eval configuration (tome-tree spike, Jupi). Rulings: Eli GO R0–R2, 2026-09-28.
# Every model / budget / provenance value lives here, never in code. Evan: swap the model here.

[answer]
# One shared answerer for BOTH arms (and, later, node summaries). Jev never answers.
provider = "opencode"                          # opencode | fake
model = "opencode-go/deepseek-v4.1-flash"      # DeepSeek V4.1 Flash via OpenCode
agent = "tome-answerer"                        # generated into a scratch OpenCode project; pins temperature, no tools
temperature = 0.0
max_output_tokens = 400
opencode_bin = "opencode"                      # castle: ~/.opencode/bin/opencode (pass an absolute path if not on PATH)
timeout_s = 180

[budget]
# Same passage budget in both arms (≈ chars / 4). 12_000 tokens ≈ 48 KB = the tome open() cap.
context_budget_tokens = 12000

[baseline]
# Arm A = the lattice HTTP backend (Python tome_indexer.py chunks): GET /search with the
# PDF's domain filter and retrieve_k 200, same-PDF post-filter, top_k kept, Jev shadow
# rerank replayed on that page. The search has no per-doc filter; with a vault-wide pool of
# 50 the tome PDFs are often absent (smoke 2026-09-28: sre-01 → 0 SRE hits), hence domain + retrieve_k.
transport = "http"                             # http | lapis (lapis CLI cannot set retrieve_k)
retrieve_k = 200                               # lattice per-modality pool (10..=200)
lapis_bin = "lapis"
lattice_url = "http://127.0.0.1:8080"          # lattice uvicorn serve:app (localhost only)
mode = "hybrid"
top_k = 8
retrieve_limit = 50
rerank_jev = true
chunk_map = "data/chunk-pages.jsonl"           # chunk_id → page_start/page_end, exported read-only from lattice.db

[baseline.domain]                              # PDF → lattice documents.domain (read-only lookup)
"Archmagus-Stack/09-Tomes/01-Earth-DevOps/Site Reliability Engineering.pdf" = "01-Earth-DevOps"
"Archmagus-Stack/09-Tomes/01-Earth-DevOps/The Kubernetes Book - Poulton.pdf" = "01-Earth-DevOps"
"Archmagus-Stack/09-Tomes/06-Wood-DataOps/Database Internals - Petrov.pdf" = "06-Wood-DataOps"
"Archmagus-Stack/09-Tomes/07-Aether-QuantOps/Applied-Finance/Advances in Financial Machine Learning - Lopez de Prado.pdf" = "07-Aether-QuantOps"

[baseline.indexer]
path = "projects/atrium-lattice/tome_indexer.py"   # vault-relative, on the host that runs the lattice service
# git_commit omitted: atrium-lattice has no commits (branch master, 0 commits) → recorded as null; see sha256
sha256 = "6cfd27756d32ae1d7dfb70dfd7e73a862f8a387b1866e3a76f98a40fd78c8d01"
chunk_target_chars = 2000                      # CHUNK_SIZE_TARGET_CHARS (~500 tokens)
chunk_max_chars = 4000                         # CHUNK_SIZE_MAX_CHARS
chunk_overlap_chars = 0                        # paragraph packing, no overlap; tiny chunks merged (R-029)
embedding_model = "nomic-embed-text"           # index_state.embedding_model (Ollama)
embedding_dim = 768
lattice_db_fingerprint = "atrium-lattice/data/lattice.db; 4 docs indexed 2026-07-23T00:55:55Z..01:13:13Z; 1658 chunks"

[tome]
index_dir = ".lapis/tomes"                   # vault-relative (joined to --vault / $LAPIS_VAULT); trees from `lapis tome build`
beam = 2                                       # must equal tome_tree::BEAM (fixed in the library)
max_judge_calls = 24
max_open_pages = 12
max_open_bytes = 49152
# Root pass (tome_tree::Budget). A Jev batch is one call, so 4 calls cover 64 roots.
root_calls = 4                                 # = tome_tree::DEFAULT_ROOT_CALLS
root_batch_size = 16                           # = tome_tree::DEFAULT_ROOT_BATCH
root_top_k = 6                                 # = tome_tree::DEFAULT_ROOT_TOP_K; lexical fallback after a malformed batch

[jev]
# Jev = scorer (correctness grade), walk judge, and the baseline shadow rerank. Never the answerer.
transport = "http"                             # http | none
endpoint = "https://api.typesafe.ai/v1/systemone"
key_env = "TYPESAFE_API_KEY"                   # name only; the key is read from the environment
# Grade + baseline rerank gate on this floor. The tome WALK does not (spike policy,
# Eli ruling 2026-09-28): it ranks on score only, records every candidate's score and
# confidence, and the summary counts would_fail_closed_at_0_6. Fixed at 0.6; never tuned
# to eval data.
confidence_floor = 0.6
timeout_s = 30
