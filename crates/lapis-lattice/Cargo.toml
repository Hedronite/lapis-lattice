[package]
name = "lapis-lattice"
version = "0.4.1"
edition = "2024"
description = "Embedded SQLite index for a local Markdown vault: FTS5 BM25, sqlite-vec KNN, wikilink graph, allowlisted analytics. No HTTP daemon, no Turso, no DuckDB."
license = "MIT"
repository = "https://github.com/VirtualMachinist/lapis-lattice"
homepage = "https://github.com/VirtualMachinist/lapis-lattice"
documentation = "https://docs.rs/lapis-lattice"
readme = "README.md"
keywords = ["notes", "fts5", "sqlite", "markdown", "search"]
categories = ["database", "text-processing"]
exclude = []

[dependencies]
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
# Vector KNN inside the same SQLite file. Linked into the binary and registered
# as an auto-extension, so there is no `.so` to find on PATH and
# `load_extension` never has to be enabled. Pre-1.0 upstream, pinned exactly.
sqlite-vec = "=0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
