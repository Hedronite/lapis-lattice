[package]
name = "lapis-desktop"
version = "0.4.1"
edition = "2024"
description = "Lapis desktop shell: GPUI window (feature `gpui`), HTML renderer, graph scene, GitNexus sidecar."
license = "MIT"

[features]
default = []
# Headless native-widget integration checks, opt-in so CLI CI stays lightweight.
gui-tests = ["gpui", "gpui-kit/test-support"]
# Real window via gpui-omarchy (not Zed gpui 0.2). Heavy; everything else compiles without it.
# Painting primitives (`canvas`, `paint_quad`) come through gpui-kit's `gpui` re-export.
gpui = ["dep:gpui-omarchy", "dep:gpui-kit", "dep:image"]

[dependencies]
image = { version = "0.25", optional = true, default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-segmentation = "1.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui-omarchy = { version = "0.1.2", optional = true }
gpui-kit = { version = "=0.6.1", optional = true, default-features = false, features = ["assets"] }
# Graph data comes from the vault's own index — no daemon, same as the CLI.
lapis-lattice = { path = "../lapis-lattice", version = "0.4.1" }
