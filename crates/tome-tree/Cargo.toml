[package]
name = "tome-tree"
version = "0.1.0"
edition = "2024"
description = "Page-spanned table-of-contents tree for long PDFs. A model walks the tree to page-cited passages."
license = "MIT"
repository = "https://github.com/Hedronite/lapis-lattice"
publish = false
readme = "README.md"

[features]
default = []
# Last-resort LLM tree builder. The spike ships a stub that fails closed.
llm-struct = []

[dependencies]
lopdf = { version = "0.42", default-features = false }
pdf-extract = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
