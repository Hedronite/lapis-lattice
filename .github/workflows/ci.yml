name: ci

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + release build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # --workspace, or the engine crate's own tests never run here.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - run: ./target/release/lapis --help
      - name: no vault configured is usage (exit 1), not lattice-down
        run: |
          unset LAPIS_VAULT
          # An empty config home, so this asserts the resolver and not whatever
          # a previous step left in the runner's real config.
          export XDG_CONFIG_HOME="$(mktemp -d)"
          set +e
          ./target/release/lapis --json vault info
          code=$?
          set -e
          test "$code" -eq 1
      - name: init records the vault, so a bare lapis resolves it
        run: |
          unset LAPIS_VAULT
          export XDG_CONFIG_HOME="$(mktemp -d)"
          tmp=$(mktemp -d)
          ./target/release/lapis init "$tmp" | tee init.txt
          grep -q 'configured:' init.txt
          grep -q 'vault = ' "$XDG_CONFIG_HOME/lapis/config.toml"
          # no --vault, no environment: the config alone has to carry it
          ./target/release/lapis --json vault info | tee info.json
          grep -q '"ok": true' info.json
          ./target/release/lapis --json search welcome --embedder none | grep -q '"ok": true'
          # a second init somewhere else never steals the configured vault
          other=$(mktemp -d)
          ./target/release/lapis init "$other" | grep -q 'left alone'
          grep -q "$tmp" "$XDG_CONFIG_HOME/lapis/config.toml"
      - name: init then read without HTTP
        run: |
          tmp=$(mktemp -d)
          ./target/release/lapis init "$tmp"
          ./target/release/lapis --vault "$tmp" --json read Welcome.md | grep -q '"ok": true'

      - name: embedded search answers with no daemon (B3)
        run: |
          tmp=$(mktemp -d)
          ./target/release/lapis init "$tmp"
          ./target/release/lapis --vault "$tmp" --json search welcome --embedder none | grep -q '"ok": true'
          ./target/release/lapis --vault "$tmp" --json list | grep -q '"hash"'
          ./target/release/lapis --vault "$tmp" doctor
      - name: TUI and desktop subcommands are wired in the shipped binary
        run: |
          ./target/release/lapis tui --help | grep -q 'Terminal UI'
          tmp=$(mktemp -d)
          ./target/release/lapis init "$tmp"
          ./target/release/lapis --vault "$tmp" desktop --check | grep -q 'gpui='
      - name: hop-2 is honest, not silently empty (B11)
        run: |
          tmp=$(mktemp -d)
          ./target/release/lapis init "$tmp"
          set +e
          out=$(./target/release/lapis --vault "$tmp" neighbors Welcome.md --hop 2 2>&1)
          code=$?
          set -e
          test "$code" -ne 0
          echo "$out" | grep -q 'lattice.mode'

  # Real window binary (gpui-omarchy), not the 5a hello-world spike.
  # Default `test` job keeps desktop off so it needs no GUI libs.
  desktop-linux:
    name: desktop linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libvulkan-dev libx11-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libasound2-dev libssl-dev
      - name: build (desktop on)
        run: cargo build --release --bin lapis --features desktop
      - name: desktop --check reports gpui
        run: |
          ./target/release/lapis --help
          tmp=$(mktemp -d)
          ./target/release/lapis init "$tmp"
          ./target/release/lapis --vault "$tmp" desktop --check | tee check.txt
          grep -q 'gpui=true' check.txt
      - name: strip and package
        run: |
          strip target/release/lapis || true
          mkdir -p dist
          tar -C target/release -czf dist/lapis-desktop-linux-x64.tar.gz lapis
          cd dist && shasum -a 256 lapis-desktop-linux-x64.tar.gz > lapis-desktop-linux-x64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: lapis-desktop-linux-x64
          path: dist/*
          if-no-files-found: error

  # `tome` is off in the default binary. This job is the all-features check
  # for the spike (not `desktop`: that needs the GUI libraries above).
  tome:
    name: tome feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features tome -- -D warnings
      - run: cargo test --workspace --features tome
      - run: cargo clippy -p tome-tree --all-targets --all-features -- -D warnings
      - run: cargo test -p tome-tree --all-features

  scrub:
    name: operator-topology grep gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/scrub-gate.sh

  tops:
    name: rust-tops record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest,cargo-llvm-cov,cargo-deny
      - name: cargo-crap 0.5.0
        run: cargo install cargo-crap --locked --version 0.5.0
      - name: cargo deny
        run: cargo deny check
      - name: nextest
        run: cargo nextest run --workspace --profile ci
      - name: doc tests
        run: cargo test --workspace --doc
      - name: nextest with tome
        run: cargo nextest run --workspace --features tome --profile ci
      - name: doc tests with tome
        run: cargo test --workspace --doc --features tome
      - name: nonempty LCOV and CRAP JSON
        run: |
          mkdir -p target/tops
          # tests/tui_input.rs already runs in the test jobs and in nextest.
          # llvm-cov instrumentation makes those PTY smokes miss the 15s palette wait.
          cargo llvm-cov test --workspace --features tome --lcov --output-path target/tops/lcov.info --             --skip terminal_paste_selection_undo_and_external_save_guards             --skip terminal_missing_index_offers_background_build_and_leaves_built_health             --skip terminal_workflows_outline_history_palette_states_tasks_and_notes_routes             --skip terminal_screen_decoder_handles_incremental_status_repaints
          test -s target/tops/lcov.info
          cargo crap --workspace --lcov target/tops/lcov.info --format json > target/tops/crap.json
          test -s target/tops/crap.json
